name: Desktop checks and installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - name: Package development installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build -- --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check release signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CSC_LINK }}
          WIN_CERT: ${{ secrets.WIN_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ '${{ matrix.target }}' == 'mac' ]]; then
            test -n "$MAC_CERT" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo 'Missing macOS signing/notarization secrets'; exit 1; }
          else
            test -n "$WIN_CERT" || { echo 'Missing Windows signing certificate'; exit 1; }
          fi
      - name: Build signed release installers
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build -- --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: oatmeal-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/*
          fail_on_unmatched_files: true
